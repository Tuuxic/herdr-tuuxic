# The release (ADR 0002): `main` is the release, so a push to `main` (merging the pull request
# next -> main) tags it. It reads the layout version from mods/tuuxic-layout/mod.json; if the tag
# v<version> isn't released yet, it tags this commit (unless the tag exists), pushes the tag, and
# makes a GitHub release named after it whose notes are that version's CHANGELOG.md entry. When
# the release exists it does nothing. Only the layout version is tagged. scripts/release.sh reads both (tests/run.sh checks it).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(bash scripts/release.sh version)"
          # Done only when the release exists: a run that pushed the tag and then failed to make
          # the release finishes it when run again.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is released: nothing to do."
            exit 0
          fi
          bash scripts/release.sh notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          # ls-remote exits 2 when the tag is missing; any other failure stops the job.
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
          if [ "$rc" = 2 ]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
