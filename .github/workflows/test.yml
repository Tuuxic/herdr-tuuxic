# Tuuxic's tests (tests/run.sh: `herdr-app check` on every tuuxic-* mod, the targeted suites, the
# repo suite and scripts/release.sh) on Herdr's own engine, on the latest Herdr and on the
# minimum Herdr in mods/tuuxic-layout/mod.json. Linux and macOS must pass; Windows runs but
# doesn't block until it's shown to work. No whistle is installed: the repo suite checks against
# whistle's files at the range floor in tests/fixtures/.
name: tests

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Herdr ${{ matrix.herdr }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        herdr: [latest, minimum]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The bump checks compare against the last v* tag.
          fetch-depth: 0

      # Herdr's window libraries, and xvfb for when `check` won't run headless.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libegl1 libwayland-client0 libxcb1 libfontconfig1

      - name: Install Herdr (${{ matrix.herdr }})
        run: |
          app="$(bash tests/install-herdr.sh '${{ matrix.herdr }}' "$RUNNER_TEMP/herdr")"
          echo "HERDR_APP=$app" >> "$GITHUB_ENV"
          "$app" --version

      # On Linux `check` falls back to headless without a display; xvfb-run is the fallback's fallback.
      - name: Tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then bash tests/run.sh || xvfb-run -a bash tests/run.sh
          else bash tests/run.sh; fi
