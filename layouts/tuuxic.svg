<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- tuuxic: boxy panels on a neutral canvas; sidebar (brand, spaces, agents, footer), tab bar, terminal, whistle status bar -->
  <rect width="320" height="200" fill="#111113"/>
  <g fill="#1b1c1f" stroke="#3a3b40" stroke-width="2">
    <rect x="7" y="7" width="76" height="16"/>
    <rect x="7" y="29" width="76" height="66"/>
    <rect x="7" y="101" width="76" height="46"/>
    <rect x="7" y="153" width="76" height="27"/>
    <rect x="89" y="7" width="224" height="16"/>
    <rect x="89" y="29" width="224" height="151" fill="#151618"/>
  </g>
  <!-- brand -->
  <rect x="13" y="12" width="6" height="6" fill="#e6e6e6"/>
  <rect x="23" y="13" width="22" height="4" fill="#e6e6e6"/>
  <!-- SPACES: title, active row with accent badge, two more rows -->
  <rect x="13" y="35" width="26" height="4" fill="#e6e6e6"/>
  <rect x="11" y="46" width="68" height="12" fill="#2c2d32"/>
  <rect x="15" y="49" width="6" height="6" fill="#8fa4e0"/>
  <rect x="25" y="50" width="32" height="4" fill="#e6e6e6"/>
  <rect x="15" y="64" width="6" height="6" fill="#3a3b40"/>
  <rect x="25" y="65" width="40" height="4" fill="#8a8c93"/>
  <rect x="15" y="78" width="6" height="6" fill="#3a3b40"/>
  <rect x="25" y="79" width="24" height="4" fill="#8a8c93"/>
  <!-- AGENTS: title, one working agent -->
  <rect x="13" y="107" width="26" height="4" fill="#e6e6e6"/>
  <rect x="11" y="118" width="68" height="12" fill="#2c2d32"/>
  <rect x="15" y="122" width="6" height="4" fill="#d97757"/>
  <rect x="25" y="122" width="30" height="4" fill="#e6e6e6"/>
  <rect x="71" y="122" width="4" height="4" fill="#e0b84d"/>
  <!-- footer -->
  <rect x="13" y="159" width="34" height="3" fill="#6b6d73"/>
  <rect x="13" y="166" width="42" height="3" fill="#6b6d73"/>
  <rect x="13" y="173" width="26" height="3" fill="#6b6d73"/>
  <!-- tabs: numbers only, selected one underlined -->
  <rect x="97" y="12" width="6" height="6" fill="#e6e6e6"/>
  <rect x="93" y="20" width="16" height="2" fill="#8fa4e0"/>
  <rect x="117" y="12" width="6" height="6" fill="#6b6d73"/>
  <rect x="133" y="14" width="8" height="2" fill="#6b6d73"/><rect x="136" y="11" width="2" height="8" fill="#6b6d73"/>
  <!-- pane header -->
  <rect x="90" y="30" width="222" height="12" fill="#1b1c1f"/>
  <rect x="96" y="34" width="6" height="4" fill="#d97757"/>
  <rect x="106" y="34" width="56" height="4" fill="#e6e6e6"/>
  <rect x="166" y="34" width="34" height="4" fill="#4a4c52"/>
  <!-- terminal text -->
  <g fill="#8a8c93">
    <rect x="98" y="52" width="110" height="4"/>
    <rect x="98" y="62" width="170" height="4"/>
    <rect x="98" y="72" width="80" height="4"/>
    <rect x="98" y="88" width="10" height="4" fill="#8fa4e0"/><rect x="112" y="88" width="130" height="4"/>
    <rect x="98" y="98" width="180" height="4"/>
    <rect x="98" y="108" width="100" height="4"/>
  </g>
  <rect x="98" y="158" width="206" height="2" fill="#3a3b40"/>
  <rect x="98" y="165" width="6" height="8" fill="#e6e6e6"/>
  <!-- whistle status bar -->
  <rect x="0" y="186" width="320" height="14" fill="#1b1c1f"/>
  <rect x="0" y="186" width="34" height="14" fill="#8fa4e0"/>
  <rect x="6" y="191" width="22" height="4" fill="#111113"/>
  <rect x="40" y="191" width="34" height="4" fill="#6b6d73"/>
</svg>
